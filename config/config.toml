# Shared defaults. Put machine-specific values (media_root, tool paths)
# in config/config.local.toml, which is not committed.

# Root of the media drive (e.g. "D:\\" or "E:\\"). All state paths are relative to it.
media_root = ""

# Where state.json and reports live (relative to the project root).
data_dir = "data"

# Explicit tool paths. Empty = look in tools/ first, then in PATH.
exiftool = ""
ffmpeg = ""

# Save state.json every N processed files during long runs.
save_every = 500

# Fast fingerprint (size + first/last 64 KB). Lets later stages detect changed files.
quick_hash = true

[extensions]
photo = [".jpg", ".jpeg"]
raw = [".arw", ".dng", ".gpr"]
video = [".mp4", ".mov"]

[write]
# Extensions that get keywords embedded in the file; everything else gets a sidecar .xmp next to it
# and the original is never touched. Empty = sidecar for every format (the safest).
# Caveat: Lightroom stores JPG/DNG metadata inside the file and may not read a sidecar next to them,
# so those tags might not show up there. Use [".jpg", ".jpeg", ".dng"] to embed them instead.
embedded = []
# exiftool keeps a "<file>_original" backup of embedded writes unless this is true.
# Turn it on only after the write tests are validated (it would double 4 TB otherwise).
overwrite_original = false
# exiftool refuses to write when it finds a "minor" problem (e.g. DJI maker notes with odd
# offsets). Enabling this lets those writes through; verify image data is unchanged first.
ignore_minor_errors = false

[ignore]
# Folder-name patterns (case-insensitive, fnmatch) skipped during scan.
dirs = [
    "*.lrdata",
    "*.lrcat-data",
    "Old Lightroom Catalogs",
    "System Volume Information",
    "$RECYCLE.BIN",
]
